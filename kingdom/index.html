<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HORSKingdom</title>
<link rel="icon" href="/kingdom/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;900&family=IM+Fell+English:ital@0;1&family=Gelasio:wght@700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/kingdom/assets/vila-larga.webp" media="(orientation:landscape)">
<link rel="preload" as="image" href="/kingdom/assets/vila-em-pe.webp" media="(orientation:portrait)">
<style>
:root{
  --ink:#1d130b;--night:#0b1038;--gold:#f0bd45;--gold-3:#8a5a0e;--ice:#7fdcff;--violet:#a98bff;
  --gothic:"Grenze Gotisch","Times New Roman",serif;--fell:"IM Fell English",Georgia,serif;--geo:"Gelasio",Georgia,serif;
  --vila:url(/kingdom/assets/vila-larga.webp);
  --d:min(60vmin,440px);
}
@media (orientation:portrait){:root{--vila:url(/kingdom/assets/vila-em-pe.webp);--d:min(80vw,50vh,440px)}}
@media (max-height:520px) and (orientation:landscape){:root{--d:min(56vh,440px)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{font-family:var(--fell);color:#fff;-webkit-font-smoothing:antialiased}

/* one stacking context: night sky < village window < mist < light rim < words < flash */
.scene{position:fixed;inset:0;z-index:10;isolation:isolate}
.sky{position:absolute;inset:-10%;z-index:0;background:
  radial-gradient(circle at 12% 18%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 82% 12%,#fff 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 70% 78%,#fff 0 1px,transparent 2px),radial-gradient(circle at 24% 72%,#fff 0 1px,transparent 2px),
  radial-gradient(circle at 46% 9%,#ffe7a0 0 1.5px,transparent 2.5px),radial-gradient(circle at 92% 46%,#fff 0 1px,transparent 2px),
  radial-gradient(circle at 6% 52%,#ffe7a0 0 1px,transparent 2px),radial-gradient(circle at 58% 92%,#fff 0 1px,transparent 2px),
  radial-gradient(circle at 50% 50%,rgba(169,139,255,.28) 0,rgba(127,220,255,.10) 22%,transparent 42%),
  radial-gradient(ellipse at 50% 50%,#25307a 0,#151d58 45%,var(--night) 80%)}
.win{position:fixed;inset:0;z-index:2;pointer-events:none}
.vila{position:absolute;inset:0;background:var(--vila) center/cover no-repeat #2d5a1e;will-change:transform}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.6vh,24px);padding:16px}
.words{display:flex;flex-direction:column;align-items:center;gap:6px}
.title{position:relative;z-index:5;margin:0;font-family:var(--gothic);font-weight:900;font-size:clamp(44px,7vw,92px);line-height:.9;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--gold-3),0 8px 0 var(--ink);text-align:center}
.sub{position:relative;z-index:5;margin:0;font-style:italic;font-size:clamp(16px,2vw,20px);color:#d9e1ff;text-align:center}
.slot{position:relative;flex:none;width:var(--d);aspect-ratio:1}

/* mist over the village while the portal waits */
.mist{position:absolute;z-index:3;inset:12%;border-radius:50%;overflow:hidden;pointer-events:none}
.mist svg{width:100%;height:100%;opacity:.6;filter:blur(3px);animation:spin 26s linear infinite}

/* the light rim: soft halo, two bands of swirling energy, a bright edge, sparks */
.rim{position:absolute;inset:0;z-index:4;pointer-events:none;will-change:transform}
.rim i,.rim b{position:absolute;border-radius:50%}
.halo{inset:-8%;background:radial-gradient(circle closest-side,transparent 62%,rgba(127,220,255,.30) 72%,rgba(169,139,255,.16) 84%,transparent 100%)}
.band{inset:3%;filter:blur(1.4px);animation:spin 7s linear infinite;
  -webkit-mask:radial-gradient(circle closest-side,transparent 79%,#000 84%,#000 92%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 79%,#000 84%,#000 92%,transparent 100%)}
.band.a{background:conic-gradient(from 0deg,transparent 0 6%,var(--ice) 12%,transparent 20%,var(--violet) 30%,transparent 38%,#fff6c8 46%,transparent 52%,var(--ice) 62%,transparent 70%,var(--violet) 82%,transparent 90%)}
.band.b{inset:0;opacity:.75;animation-duration:11s;animation-direction:reverse;background:conic-gradient(from 90deg,transparent 0 10%,#bdf1ff 16%,transparent 24%,#d7c6ff 40%,transparent 48%,#bdf1ff 66%,transparent 74%,#ffe7a0 88%,transparent 96%)}
.edge{inset:12%;box-shadow:0 0 0 2px rgba(235,250,255,.95),0 0 14px 5px rgba(127,220,255,.85),0 0 38px 12px rgba(169,139,255,.45),inset 0 0 18px 7px rgba(127,220,255,.8),inset 0 0 44px 16px rgba(169,139,255,.35)}
.spark{inset:0;animation:spin var(--t) linear infinite;animation-delay:var(--at)}
.spark::after{content:"";position:absolute;left:50%;top:var(--y);width:var(--s);height:var(--s);margin-left:calc(var(--s)/-2);border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--c);animation:twinkle var(--tw) ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{from{opacity:.25;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

.flash{position:fixed;inset:0;z-index:6;background:radial-gradient(circle,#ffffff,#d8f6ff 45%,#b9a6ff);opacity:0;pointer-events:none}
.wallet{position:relative;z-index:5;display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border:0;border-radius:10px;cursor:pointer;font-family:var(--geo);font-weight:700;font-size:18px;line-height:1;letter-spacing:.03em;color:#2b1a0d;white-space:nowrap;background:linear-gradient(#ffd85a,#e0a91f);box-shadow:0 0 0 2px #0a1636,0 5px 0 2px #0a1636,inset 0 3px 0 rgba(255,255,255,.5);transition:transform .12s}
.wallet img{width:32px;height:32px;border-radius:8px;flex:none}
.wallet:hover{transform:translateY(-2px)}
.wallet:active{transform:translateY(3px)}
.wallet:focus-visible{outline:3px solid #fff;outline-offset:4px}
.wallet[aria-busy="true"]{cursor:progress;opacity:.85}
/* what the gate says when the wallet is missing or says no, and the ways to a wallet */
.gmsg{position:relative;z-index:5;max-width:min(92vw,440px);margin:12px auto 0;font-size:15px;line-height:1.4;color:#ffd7a8;text-align:center;text-shadow:0 1px 0 #0a1636}
.gmsg[hidden],.gnow[hidden]{display:none}
.gnow{position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 18px;margin-top:12px}
.gnow .wallet{text-decoration:none;padding:8px 18px}
.glink{font-weight:700;font-size:15px;color:#d9e1ff;text-decoration:underline;text-underline-offset:3px}
.inside .sky,.inside .ui{display:none}
.inside .win{clip-path:none!important}
@media (max-height:520px) and (orientation:landscape){
  .ui{flex-direction:row;column-gap:32px}
  .title{font-size:44px;-webkit-text-stroke:2px var(--ink)}
  .wallet{font-size:15px;padding:4px 12px 4px 4px}.wallet img{width:26px;height:26px}
}
@media (max-height:520px) and (orientation:landscape) and (max-width:799px){
  .ui{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:clamp(16px,4vw,32px);row-gap:14px;align-content:center;justify-content:center}
  .ui>.words:first-child{grid-column:2;grid-row:1;align-self:end}
  .ui>.slot{grid-column:1;grid-row:1/3;align-self:center}
  .ui>.words:last-child{grid-column:2;grid-row:2;align-self:start}
  .gmsg{max-width:min(46vw,300px)}
}
@media (prefers-reduced-motion:reduce){.mist svg,.band,.spark,.spark::after{animation:none}}

/* ---------- the realm: wood header, the village map, the parchment ---------- */
:root{--hb:64px}
.realm{position:fixed;inset:0;z-index:1;background:#2d5a1e;visibility:hidden}
.top{--bh:calc(var(--hb)*124/112);--cap:calc(var(--bh)*100/124);--fade:calc(var(--bh)*40/124);position:absolute;top:0;left:0;right:0;z-index:3;height:var(--hb);background:#3b200f}
.bars{position:absolute;inset:0 0 auto;height:var(--bh);pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.bar{position:absolute;top:0;height:100%;background:0 0/auto 100% no-repeat}
.bar.m{left:calc(var(--cap) - var(--fade));right:calc(var(--cap) - var(--fade));background-image:url(/kingdom/assets/bar-mid.webp);background-repeat:repeat-x}
.bar.l{left:0;width:var(--cap);background-image:url(/kingdom/assets/bar-l.webp)}
.bar.r{right:0;width:var(--cap);background-image:url(/kingdom/assets/bar-r.webp);background-position:100% 0}
.top .in{position:relative;z-index:2;display:flex;align-items:center;gap:14px;height:100%;padding-inline:calc(var(--cap)*.42)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink)}
.brand b{font-family:var(--gothic);font-weight:900;font-size:28px;color:var(--gold);letter-spacing:.5px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.acct{display:flex;align-items:center;gap:10px}
.addr{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 4px;border-radius:999px;background:#1a0e05;box-shadow:0 0 0 2px #d9a947,0 0 0 3.5px var(--ink);font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:15px;color:#f6e3b0;white-space:nowrap}
.addr[hidden]{display:none}
.addr img{width:26px;height:26px;border-radius:50%}
.addr::after{content:"";width:8px;height:8px;border-radius:50%;background:#2fb457;box-shadow:0 0 0 2px var(--ink)}
.addr .s{display:none}
.logout{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:8px;cursor:pointer;font-family:var(--gothic);font-weight:700;font-size:17px;line-height:1;color:#fff;white-space:nowrap;background:linear-gradient(#c8363c,#8e1a1f);box-shadow:0 0 0 2px #d9a947,0 0 0 3.5px var(--ink),inset 0 2px 0 rgba(255,255,255,.3);transition:transform .12s}
.logout svg{width:16px;height:16px;flex:none}
.logout:hover{transform:translateY(-1px)}
.logout:active{transform:translateY(2px)}
.logout:focus-visible{outline:3px solid #fff;outline-offset:4px}
.logout[hidden]{display:none}
/* the knight's card (Santa, 20/10: "show how much horske, ronke and ron you have", "the status, like top 69 ronke score";
   Rafael: "não deveria ser um card em madeira com os detalhes do user?", "não dava pra ser na barra de madeira superior
   também?", "tem telas que vai precisar do card em madeira separado. só bote na barra superior em telas mais largas"):
   the wallet, its Ronke Score (the badge; its points in the tip), its HORSKE, RONKE and RON in dark wells, and Log out.
   On an upright screen (or a narrow one), a board of the Joust Arena panel's wood (/kingdom/assets/wood-dark.webp, the gold bevel)
   across the bottom, over the forest where no place stands; on a wider screen held sideways, its row in the wood bar */
.pcard{--bevel:0 0 0 1px #452600,0 0 0 2px #926e3d,0 0 0 3px #d6b37f,0 0 0 4px #a1805a,0 0 0 6px #1d130b;--well:rgba(20,10,3,.5);--wellring:rgba(240,189,69,.28);
  position:absolute;z-index:3;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:440px;margin-inline:auto;padding:9px;border-radius:6px;color:#fff3d6;
  background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(16,7,0,.6) 46px 48px,rgba(255,214,150,.09) 48px 49px,transparent 49px 50px),#42250f url(/kingdom/assets/wood-dark.webp) 0 0/700px auto repeat;
  box-shadow:var(--bevel),0 10px 18px rgba(0,0,0,.45),inset 0 0 30px rgba(0,0,0,.45)}
.pcard[hidden],.pcard .rank[hidden],.pscore[hidden]{display:none}
.prow{display:flex;align-items:center;gap:8px}
.prow .rank{margin-left:auto}
.pcard .addr{height:30px}
.pcard .logout{flex:none;height:30px;padding:0 8px}
.pwells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.pw{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:5px 3px;border-radius:8px;background:var(--well);box-shadow:inset 0 0 0 2px var(--wellring)}
.pw small{font-family:var(--geo);font-weight:700;font-size:9px;letter-spacing:.08em;color:#f0bd45;text-shadow:0 1px 0 var(--ink)}
.pw b{font-family:var(--geo);font-weight:700;font-size:18px;line-height:1;color:#fff3d6;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 var(--ink)}
.pscore{margin:8px 0 0;font-size:12.5px;line-height:1.3;color:#e3cfa8;text-align:center}
/* the card's parts do things: the address copies, the badge opens the Ronke Score, a well opens its swap */
.pcard button.addr,.pcard button.pw{border:0;font:inherit;cursor:pointer}
.pcard button.addr{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:#f6e3b0}
.pcard a.pw,.pcard a.rank{text-decoration:none;cursor:pointer}
.pcard .pw{transition:box-shadow .15s,transform .12s}
.pcard .pw:hover{box-shadow:inset 0 0 0 2px #f0bd45,0 0 10px rgba(240,189,69,.25)}
.pcard .pw:active,.pcard button.addr:active,.pcard a.rank:active{transform:translateY(1px)}
.pcard .pw:focus-visible,.pcard button.addr:focus-visible,.pcard a.rank:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ptoast{position:absolute;left:50%;top:100%;z-index:4;transform:translate(-50%,8px);padding:6px 12px;border-radius:999px;background:#1a0e05;box-shadow:0 0 0 2px #d9a947,0 0 0 3.5px var(--ink),0 6px 12px rgba(0,0,0,.4);font-family:var(--geo);font-weight:700;font-size:13px;color:#f6e3b0;white-space:nowrap;pointer-events:none}
.ptoast[hidden]{display:none}
.rank{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:999px;background:#2a1a0b;box-shadow:0 0 0 2px #d9a947,0 0 0 3.5px var(--ink);font-family:var(--gothic);font-weight:700;font-size:16px;line-height:1;color:#f6e3b0;white-space:nowrap;cursor:default}
.rank.gold{background:linear-gradient(#ffd85a,#e0a91f);color:#2b1a0d;box-shadow:0 0 0 2px #0a1636,0 0 0 3.5px #d9a947,inset 0 2px 0 rgba(255,255,255,.45)}
@media (max-width:620px){.pscore{display:none}}
@media (orientation:portrait),(max-width:639px){.ptoast{top:auto;bottom:100%;transform:translate(-50%,-10px)}}
/* a wider screen held sideways: the card's row in the wood bar, on the right */
@media (orientation:landscape) and (min-width:640px){
  .pcard{--well:rgba(20,10,3,.55);--wellring:rgba(240,189,69,.32);left:auto;right:calc(var(--hb)*.375);top:0;bottom:auto;max-width:none;margin:0;height:var(--hb);padding:0;display:flex;align-items:center;gap:8px;border-radius:0;background:none;box-shadow:none}
  .prow{order:2}.prow .rank{margin-left:0}
  .pwells{display:flex;gap:8px;margin:0}
  .pw{flex-direction:row;align-items:baseline;gap:6px;height:34px;padding:8px 12px 0;box-shadow:inset 0 0 0 2px var(--wellring),0 1px 0 rgba(255,214,150,.12)}
  .pw small{font-size:10px;letter-spacing:.12em}.pw b{font-size:17px}
  .pscore{display:none}
  .pcard .addr,.pcard .logout,.rank{height:34px}.rank{padding:0 13px;font-size:18px}
}
/* a narrower bar (a laptop, a tablet or a phone held sideways): the name gives way (the logo stays), the wallet shows short */
@media (orientation:landscape) and (min-width:640px) and (max-width:1100px){
  .brand b{display:none}
  .pcard .addr .l{display:none}.pcard .addr .s{display:inline}
}
@media (orientation:landscape) and (min-width:640px) and (max-height:520px){
  .brand b{display:none}
  .pcard{right:12px;gap:6px}
  .pwells{gap:6px}
  .pw{height:30px;padding:7px 9px 0;gap:5px}.pw small{font-size:9px}.pw b{font-size:15px}
  .pcard .addr,.pcard .logout,.rank{height:30px}.rank{padding:0 10px;font-size:16px}
  .pcard .addr .l{display:none}.pcard .addr .s{display:inline}
}

/* phones: the map scrolls (drag it). PC and tablet (.fit): the whole realm shows, nothing scrolls */
.map{position:absolute;left:0;right:0;bottom:0;top:var(--hb);overflow:auto;scrollbar-width:none;overscroll-behavior:contain;cursor:grab;background:#2d5a1e}
.map.fit{overflow:hidden;overflow:clip;cursor:default}
.map::-webkit-scrollbar{display:none}
.map.drag{cursor:grabbing}
.world{position:relative}
.map.fit .world{position:absolute}
.world svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{cursor:pointer;outline:none}
.spot .lit{opacity:0;filter:brightness(1.2) saturate(1.12);transition:opacity .2s cubic-bezier(.2,0,0,1);pointer-events:none}
.spot .hit{fill:transparent;stroke:none}
.spot:hover .lit,.spot.on .lit,.spot:focus-visible .lit{opacity:1}
.tag{position:absolute;z-index:2;transform-origin:50% 100%;transform:translate(-50%,-100%) scale(var(--ts,1));display:inline-grid;place-items:center;height:36px;min-width:120px;padding:0 24px 2px;border:0;background:url(/kingdom/assets/placa.webp) center/100% 100% no-repeat;font-family:var(--gothic);font-weight:700;font-size:20px;line-height:1;color:#fff3d6;text-shadow:0 2px 0 #3a1d08,1px 0 0 #3a1d08,-1px 0 0 #3a1d08;white-space:nowrap;cursor:pointer;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.tag:hover,.tag.on{transform:translate(-50%,calc(-100% - 5px)) scale(var(--ts,1))}
.tag:focus-visible{outline:3px solid #fff;outline-offset:3px}
.alert{position:absolute;right:-14px;top:-16px;width:30px;height:auto;animation:pop .5s cubic-bezier(.3,1.6,.5,1) .3s both;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* the parchment that opens for each place */
.panel{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:16px;background:rgba(8,10,30,.55)}
.panel[hidden]{display:none}
.parch{position:relative;width:min(420px,100%);padding:30px 28px 26px;background:#efdcb3 url(/kingdom/assets/paper.webp) center/1024px;border:3px solid var(--ink);box-shadow:0 10px 0 var(--ink),inset 0 0 60px rgba(122,78,28,.32),inset 0 0 12px rgba(122,78,28,.36);text-align:center;color:var(--ink)}
.parch::before{content:"";position:absolute;inset:9px;border:2px solid #c98c1d;pointer-events:none}
.parch h2{margin:0;font-family:var(--gothic);font-weight:900;font-size:40px;line-height:1;color:#1d3778}
.parch p{margin:12px 0 0;font-size:19px;line-height:1.4}
.parch .why{margin-top:10px;font-style:italic;color:#8e1a1f}
.parch .soon{margin-top:18px;font-style:italic;color:#5a4630}
.parch .x{position:absolute;right:8px;top:6px;z-index:1;width:40px;height:40px;border:0;background:none;font-family:var(--geo);font-size:30px;line-height:1;color:var(--ink);cursor:pointer}
/* no square ring around the × (Rafael, 17/10: "odeio esse quadrado que fica"): the card takes the focus when it opens,
   and a key user tabbing to the × sees a soft round mark */
.parch:focus,.bcard:focus,.parch .x:focus,.bcard .x:focus{outline:none}
.parch .x,.bcard .x{border-radius:50%}
.parch .x:focus-visible{background:rgba(43,26,13,.14)}
.go{position:relative;display:inline-flex;align-items:center;margin-top:20px;padding:10px 20px;border-radius:10px;text-decoration:none;font-family:var(--geo);font-weight:700;font-size:18px;color:#2b1a0d;background:linear-gradient(#ffd85a,#e0a91f);box-shadow:0 0 0 2px #0a1636,0 5px 0 2px #0a1636,inset 0 3px 0 rgba(255,255,255,.5);transition:transform .12s}
.go:hover{transform:translateY(-2px)}
.go:focus-visible{outline:3px solid #1d3778;outline-offset:4px}
.go[hidden],.soon[hidden],.why[hidden]{display:none}
/* Tavern and Market: the game page draws their modal (justa-web src/modal) in a frame over the whole village, with no
   background of its own; until the frame says it is ready the village dims and shows a loader */
.box{position:absolute;inset:0;z-index:5;background:rgba(8,10,30,.55)}
.box[hidden]{display:none}
/* the frame keeps to the screen's safe area (a notch, the home bar: viewport-fit=cover, and a frame gets no insets of
   its own); the box's dim covers the rest, and the frame draws no dim of its own */
.box iframe{position:absolute;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:none;opacity:0}
.box.ready iframe{opacity:1}
.bload{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.bload[hidden]{display:none}
.bcard{position:relative;display:flex;align-items:center;gap:14px;padding:18px 60px 18px 24px;background:#efdcb3 url(/kingdom/assets/paper.webp) center/1024px;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink),inset 0 0 36px rgba(122,78,28,.32);font-family:var(--gothic);font-weight:900;font-size:28px;line-height:1;color:#1d3778}
.bcard .x{position:absolute;right:8px;top:50%;margin-top:-20px;width:40px;height:40px;border:0;background:none;font-family:var(--geo);font-size:30px;line-height:1;color:var(--ink);cursor:pointer}
.bcard .x:focus-visible{background:rgba(43,26,13,.14)}
.spin{flex:none;width:28px;height:28px;border-radius:50%;border:4px solid rgba(43,26,13,.22);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.gos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 12px;margin-top:20px}.gos:empty{display:none}.gos .go{margin-top:0}
/* the joust's card: its modes one under the other, full width; one still to come stays grey and dead */
.gos.modes{flex-direction:column;align-items:stretch;gap:14px}
.gos.modes .go{justify-content:center;gap:10px;padding:12px 20px;font-size:19px}
.go.off{cursor:default;color:#5d544b;background:linear-gradient(#d8d0c4,#b2a99c);box-shadow:0 0 0 2px #4a4038,0 5px 0 2px #4a4038,inset 0 3px 0 rgba(255,255,255,.4)}
.go.off:hover{transform:none}
.go.off small{padding:1px 8px;border-radius:999px;background:#4a4038;color:#efe7da;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:620px){
  :root{--hb:58px}
  .top .in{padding-inline:16px;gap:10px}
  .brand b{display:none}
  .addr{height:30px;padding:0 7px;font-size:12px}
  .addr img,.addr::after,.addr .l{display:none}
  .addr .s{display:inline}
  .logout{height:30px;padding:0 8px}
  .logout span{display:none}
  .tag{height:31px;min-width:96px;padding:0 18px 2px;font-size:17px}
  .alert{width:26px;right:-11px;top:-14px}
  .parch h2{font-size:34px}
}
@media (prefers-reduced-motion:reduce){.tag,.spot .lit,.alert{transition:none;animation:none}}

<script>
(function(){
  // the mist: three soft spiral arms over the village
  var NS='http://www.w3.org/2000/svg',arms=document.getElementById('arms');
  for(var k=0;k<3;k++){
    var d='',off=k*2*Math.PI/3;
    for(var t=0;t<=1;t+=.02){var th=off+t*3.2*Math.PI,r=6+t*96;d+=(t?'L':'M')+(r*Math.cos(th)).toFixed(1)+' '+(r*Math.sin(th)).toFixed(1)}
    [['#a98bff',22,.45],['#7fdcff',10,.6],['#ffffff',3,.7]].forEach(function(s){
      var p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('stroke',s[0]);p.setAttribute('stroke-width',s[1]);p.setAttribute('opacity',s[2]);arms.appendChild(p);
    });
  }
})();

(function(){
  var $=function(id){return document.getElementById(id)};
  var scene=$('scene'),sky=$('sky'),slot=$('slot'),rim=$('rim'),mist=$('mist'),win=$('win'),vila=$('vila'),flash=$('flash');
  var btn=$('enter'),title=$('title'),sub=$('sub'),again=$('again');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)'),busy=false,g;
  // cubic-bezier as a function, to sample the approach into keyframes
  function bez(x1,y1,x2,y2){return function(x){var t=x;for(var i=0;i<8;i++){var f=3*x1*t*(1-t)*(1-t)+3*x2*t*t*(1-t)+t*t*t-x,d=3*x1*(1-t)*(1-t)+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(f)<1e-5)break;t=Math.min(1,Math.max(0,t-f/(d||1e-6)))}return 3*y1*t*(1-t)*(1-t)+3*y2*t*t*(1-t)+t*t*t}}
  var IN=bez(.62,0,.9,.32),IO=bez(.65,0,.35,1);   // the portal is pulled in (slow, then fast); the village eases in and out

  // where the portal is: its center, the window radius (under the bright edge, 38% of the slot), how far it must grow
  // to cover the screen (S), and how small the village looks inside it (V0). The village is drawn to fill the screen at
  // scale 1; inside the portal it is smaller, but never smaller than the window, or its edge would show.
  function geom(){
    var r=slot.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width*.38,W=innerWidth,H=innerHeight;
    var far=Math.max(Math.hypot(cx,cy),Math.hypot(W-cx,cy),Math.hypot(cx,H-cy),Math.hypot(W-cx,H-cy));
    var m=Math.min(cx,W-cx,cy,H-cy);
    return {cx:cx,cy:cy,R:R,m:m,S:far/R*1.15,V0:Math.max(.6,Math.min(.95,1.15*R/m))};
  }
  function circ(r){return 'circle('+r.toFixed(1)+'px at '+g.cx.toFixed(1)+'px '+g.cy.toFixed(1)+'px)'}
  function place(){                 // the waiting portal: the village already shows inside it
    if(busy||scene.classList.contains('inside'))return;
    g=geom();win.style.clipPath=circ(g.R);
    var f=window.realmFrame&&realmFrame();
    if(f)vila.style.background='url('+f.src+') '+f.ox+'px '+(f.top+f.oy)+'px/'+f.W+'px '+f.H+'px no-repeat,linear-gradient(#3b200f,#3b200f) 0 0/100% '+f.top+'px no-repeat,#2d5a1e';
    vila.style.transformOrigin=g.cx+'px '+g.cy+'px';vila.style.transform='scale('+g.V0+')';
  }
  function inside(){scene.classList.add('inside');busy=false;btn.removeAttribute('aria-busy');if(window.enterRealm)enterRealm()}

  function enter(){
    if(busy)return;place();busy=true;
    if(reduce.matches){             // no zoom: the gate simply fades into the village
      vila.style.transform='none';win.style.clipPath='none';
      win.animate([{opacity:0},{opacity:1}],{duration:280,easing:'cubic-bezier(.2,0,0,1)'}).finished.then(inside);
      return;
    }
    var F='forwards',GO=520,GO_D=1500,n=40,kr=[],kc=[],kv=[];
    // the words leave first, quietly; the mist clears
    [title,sub,btn].forEach(function(e,i){e.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(8px)'}],{duration:220,delay:i*40,easing:'cubic-bezier(.4,0,1,1)',fill:F})});
    mist.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.25)'}],{duration:520,easing:'cubic-bezier(.16,1,.3,1)',fill:F});
    // the portal comes at you. The ring grows faster than the village inside, so the village keeps looking far below
    // until the ring passes your sides; then the village lands at full size.
    for(var i=0;i<=n;i++){
      var p=i/n,s=1+(g.S-1)*IN(p),r=g.R*s,v=Math.max(g.V0+(1-g.V0)*IO(p),Math.min(1,r/g.m*1.04));
      kr.push({offset:p,transform:'scale('+s.toFixed(3)+')'});kc.push({offset:p,clipPath:circ(r)});kv.push({offset:p,transform:'scale('+v.toFixed(4)+')'});
    }
    var T={delay:GO,duration:GO_D,easing:'linear',fill:F};
    rim.animate(kr,T);win.animate(kc,T);
    sky.animate([{transform:'scale(1)'},{transform:'scale(1.4)'}],{delay:GO,duration:GO_D,easing:'cubic-bezier(.62,0,.9,.32)',fill:F});
    flash.animate([{opacity:0},{opacity:.4,offset:.3},{opacity:0}],{delay:GO+GO_D-260,duration:480,easing:'linear',fill:F});
    vila.animate(kv,T).finished.then(inside);
  }
  // a tap during the entrance skips to the end
  scene.addEventListener('pointerdown',function(e){
    if(!busy||e.target===btn)return;
    document.getAnimations().forEach(function(a){if(a.effect&&a.effect.getTiming().iterations!==Infinity)a.finish()});
  });
  var gmsg=$('gmsg'),gnow=$('gnow'),gopen=$('gopen');
  var phone=matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  function provider(){return (window.ronin&&window.ronin.provider)||window.ethereum||null}
  // the wallet's provider, waited for: an extension may put it on the page a moment after these scripts run (Santa,
  // 20/10: "Back to kingdom brings you back to the portal page"), so a look that finds none looks again every 100 ms
  // for up to `ms`
  function waitProvider(ms){return new Promise(function(res){var p=provider();if(p||!ms)return res(p);var t0=Date.now(),iv=setInterval(function(){var q=provider();if(q||Date.now()-t0>=ms){clearInterval(iv);res(q||null)}},100)})}
  function say(t){gmsg.textContent=t||'';gmsg.hidden=!t}
  gopen.href='https://wallet.roninchain.com/in_app_browser?url='+encodeURIComponent(location.origin+location.pathname);
  window.realmProvider=provider;window.waitProvider=waitProvider;
  function noWallet(){               // no wallet in this browser: on a phone the Ronin Wallet app opens this page; elsewhere, the extension
    if(phone){say('Open this page in the Ronin Wallet app to enter the kingdom.');gnow.hidden=false}
    else{gmsg.innerHTML='Install the <a class="glink" href="https://wallet.roninchain.com/" target="_blank" rel="noopener">Ronin Wallet \u2197</a>, then reload this page.';gmsg.hidden=false}
  }
  function connect(p){
    say('');gnow.hidden=true;btn.setAttribute('aria-busy','true');btn.querySelector('span').textContent='Connecting…';
    p.request({method:'eth_requestAccounts'}).then(function(a){
      btn.removeAttribute('aria-busy');
      if(a&&a[0]){window.realmAcct=a[0];enter()}
      else{reset();say('The wallet gave no account: unlock it and try again.')}
    },function(e){
      reset();
      say(e&&e.code===4001?'The wallet said no. Connect when you are ready.':e&&e.code===-32002?'Your wallet is already asking: open it to finish.':'The wallet did not answer. Try again.');
    });
  }
  var looking=false;
  btn.addEventListener('click',function(){
    if(busy||looking)return;
    var p=provider();
    if(p)return connect(p);
    looking=true;                    // a click before the wallet arrived: wait a moment for it
    waitProvider(1500).then(function(q){looking=false;if(q)connect(q);else noWallet()});
  });
  // a wallet this site connected before: the button says the gate will open at once
  waitProvider(3000).then(function(p){if(p)p.request({method:'eth_accounts'}).then(function(a){if(a&&a[0]&&!busy)btn.querySelector('span').textContent='Enter the Kingdom'},function(){})});
  function reset(){
    document.getAnimations().forEach(function(a){if(a.effect&&a.effect.getTiming().iterations!==Infinity)a.cancel()});
    scene.classList.remove('inside');busy=false;btn.removeAttribute('aria-busy');btn.querySelector('span').textContent='Connect Ronin Wallet';
    gmsg.hidden=true;gnow.hidden=true;
    place();
  }
  window.gateReset=reset;window.gatePlace=place;
  addEventListener('resize',place);
  if(window.ResizeObserver){var ro=new ResizeObserver(function(){place()});document.querySelectorAll('.ui .words').forEach(function(e){ro.observe(e)})}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
  place();
})();
</script>

  function frame(){
    var M=innerHeight>innerWidth?MAPS.port:MAPS.land,mw=map.clientWidth,mh=map.clientHeight,fit=Math.min(innerWidth,innerHeight)>=600,k,W,H,ox,oy;
    if(fit){      // PC and tablet: the whole realm in view. The drawing fills the screen and is cut only where nothing is

      var B=M.box||[0,0,M.w,M.h],kc=Math.max(mw/M.w,mh/M.h),kf=Math.min(mw/(B[2]-B[0]),mh/(B[3]-B[1]));

  }
  window.realmFrame=frame;
  function build(){
    var f=frame(),M=f.M,k=f.k,W=f.W,H=f.H;
    // the light on a place is a soft oval that fades out over the grass, so no outline shows
    var svg='<svg viewBox="0 0 '+M.w+' '+M.h+'"><defs><radialGradient id="soft"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>',spots='',tags='';
    for(var id in M.spots){
      var S=M.spots[id],P=PLACES[id],xs=[],ys=[];
      S.p.split(' ').forEach(function(q){var c=q.split(',');xs.push(+c[0]);ys.push(+c[1])});
      var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
      svg+='<mask id="m-'+id+'" maskUnits="userSpaceOnUse" x="0" y="0" width="'+M.w+'" height="'+M.h+'"><ellipse cx="'+(x0+x1)/2+'" cy="'+(y0+y1)/2+'" rx="'+((x1-x0)*.6).toFixed(0)+'" ry="'+((y1-y0)*.62).toFixed(0)+'" fill="url(#soft)"/></mask>';
      spots+='<g class="spot" data-id="'+id+'" tabindex="0" role="button" aria-label="'+P.name+'"><image class="lit" href="'+M.src+'" width="'+M.w+'" height="'+M.h+'" mask="url(#m-'+id+')"/><polygon class="hit" points="'+S.p+'"/></g>';
      tags+='<button class="tag" type="button" data-id="'+id+'" tabindex="-1" style="left:'+(S.t[0]/M.w*100).toFixed(2)+'%;top:'+(S.t[1]/M.h*100).toFixed(2)+'%">'+P.tag+(ALERTS[id]?'<img class="alert" src="/kingdom/assets/alerta.webp" alt="">':'')+'</button>';
    }
    svg+='</defs><image href="'+M.src+'" width="'+M.w+'" height="'+M.h+'"/>'+spots+'</svg>';
    map.classList.toggle('fit',f.fit);
    world.style.width=W+'px';world.style.height=H+'px';
    if(f.fit){world.style.left=f.ox+'px';world.style.top=f.oy+'px';world.style.setProperty('--ts',Math.max(.62,Math.min(1,k/.8)).toFixed(3))}
    else{world.style.left=world.style.top='';world.style.removeProperty('--ts')}
    world.innerHTML=svg+tags;
    if(!f.fit&&M!==cur){map.scrollLeft=M.focus[0]*k-map.clientWidth/2;map.scrollTop=M.focus[1]*k-map.clientHeight/2}
    cur=M;
    if(window.gatePlace)gatePlace();
  }
  function light(id,on){world.querySelectorAll('[data-id="'+id+'"]').forEach(function(e){e.classList.toggle('on',on)})}
  function open(id){
    var P=PLACES[id];
    if(P.go){location.assign(P.go);return}
    if(MODAL_PLACE[id])return openBox(id);
    last=document.activeElement;
    $('pName').textContent=P.name;$('pText').textContent=P.text||'';$('pText').hidden=!P.text;
    // the joust's card says no "A GAMBA is open." (Rafael, 17/10: "tira esse a gamba is open"); its plaque keeps the alert
    $('pWhy').hidden=!ALERTS[id]||!!P.modes;$('pWhy').textContent=ALERTS[id]||'';
    var links=P.links||[],box=$('pGos');box.textContent='';$('pSoon').hidden=links.length>0;
    box.classList.toggle('modes',!!P.modes);
    links.forEach(function(L){
      if(L[3]==='soon'){var o=document.createElement('span');o.className='go off';o.setAttribute('role','button');o.setAttribute('aria-disabled','true');o.textContent=L[0];var m=document.createElement('small');m.textContent='Soon';o.appendChild(m);box.appendChild(o);return}
      var a=document.createElement('a');a.className='go';a.href=L[1];a.textContent=L[0];if(L[2]){a.target='_blank';a.rel='noopener'}box.appendChild(a)});
    panel.hidden=false;
    if(!reduce.matches)panel.firstElementChild.animate([{opacity:0,transform:'translateY(10px) scale(.96)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.16,1,.3,1)'});
    panel.animate([{opacity:0},{opacity:1}],{duration:reduce.matches?1:180,easing:'linear'});
    $('pCard').focus({preventScroll:true});
  }
  function close(){
    if(panel.hidden)return;
    var a=panel.animate([{opacity:1},{opacity:0}],{duration:reduce.matches?1:150,easing:'cubic-bezier(.4,0,1,1)'});
    a.finished.then(function(){panel.hidden=true;if(last&&last.focus)last.focus()});
  }

  // Tavern, Market and Castle: their modal is drawn by the game page (justa-web src/modal/modal.js) in a frame over the whole
  // village (Rafael, 16/10: "tudo do kingdom sejam modais tirando a parte da justa", "arruma todos modais"). The frame
  // has no background, so the live village shows around the panel; it says when it is ready and when it closes, and a
  // bout (the lists' part) sends the whole window to the game. One frame, kept while the modal is open; it goes 1.5 s
  // after the modal closes (a purchase's save finishes first) and at once when the page is left, so a page restored
  // from the back/forward cache never holds an old season
  function door(){bFrame.contentWindow.postMessage({type:'justa-door',door:MODAL_PLACE[want],place:want},location.origin)}
  function shown(){bLoad.hidden=true;box.classList.add('ready');bFrame.focus()}
  function openBox(id){
    var P=PLACES[id];if(!box.contains(document.activeElement))boxLast=document.activeElement;clearTimeout(drop);want=id;
    if(fade){fade.cancel();fade=null}closing=false;   // a reopen during the closing fade keeps the box
    $('bName').textContent='Opening '+P.name.replace(/^The /,'the ')+'\u2026';
    box.hidden=false;
    box.animate([{opacity:0},{opacity:1}],{duration:reduce.matches?1:180,easing:'linear'});
    if(bFrame&&ready){door();shown();return}
    box.classList.remove('ready');bLoad.hidden=false;
    if(!bFrame){bFrame=document.createElement('iframe');bFrame.title=P.name;box.insertBefore(bFrame,bLoad);ready=false;bFrame.src='/kingdom/play/?modal=1&building='+id+'&door='+MODAL_PLACE[id]}
    if(!reduce.matches)bLoad.firstElementChild.animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.16,1,.3,1)'});
    $('bCard').focus({preventScroll:true});
  }
  function dropFrame(){if(bFrame){bFrame.remove();bFrame=null;ready=false}}
  function closeBox(now){   // once per opening: a second close during the fade (a double tap on ×) is the same close
    if(box.hidden||(closing&&!now))return;
    closing=true;
    var done=function(){if(!closing)return;closing=false;fade=null;box.hidden=true;clearTimeout(drop);drop=setTimeout(dropFrame,now?0:1500);if(boxLast&&boxLast.focus)boxLast.focus()};
    if(fade){fade.cancel();fade=null}
    if(now||reduce.matches){done();return}
    fade=box.animate([{opacity:1},{opacity:0}],{duration:150,easing:'cubic-bezier(.4,0,1,1)'});
    fade.finished.then(done,function(){});
  }
  window.closeBox=closeBox;
  addEventListener('message',function(e){
    if(e.origin!==location.origin||!bFrame||e.source!==bFrame.contentWindow||!e.data)return;
    if(e.data.type==='justa-ready'){ready=true;bFrame.title=PLACES[want].name;door();if(!box.hidden)shown()}
    if(e.data.type==='justa-close')closeBox();
    if(e.data.type==='justa-wallet'&&window.purseNow)purseNow();   // a swap or a lock went through: the purse anew
    if(e.data.type==='justa-open'&&Object.prototype.hasOwnProperty.call(PLACES,e.data.place)){closeBox(true);open(e.data.place)}   // a modal sends the player to another place
  });
  $('bClose').addEventListener('click',function(){closeBox()});
  box.addEventListener('click',function(e){if(e.target===box||e.target===bLoad)closeBox()});   // outside the card, or the safe-area strips
  addEventListener('pagehide',function(){if(fade){fade.cancel();fade=null}closing=false;box.hidden=true;clearTimeout(drop);dropFrame()});

  // phones: drag the map with the mouse (touch scrolls natively); a drag is not a click
  var drag=null,moved=false;
  map.addEventListener('pointerdown',function(e){if(map.classList.contains('fit')||e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,l:map.scrollLeft,t:map.scrollTop};moved=false});
  addEventListener('pointermove',function(e){
    if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>6){moved=true;map.classList.add('drag')}
    if(moved){map.scrollLeft=drag.l-dx;map.scrollTop=drag.t-dy}
  });
  addEventListener('pointerup',function(){drag=null;map.classList.remove('drag')});
  world.addEventListener('click',function(e){
    if(moved){moved=false;e.preventDefault();return}
    var t=e.target.closest('[data-id]');if(t)open(t.getAttribute('data-id'));
  },true);
  world.addEventListener('keydown',function(e){var t=e.target.closest('.spot');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(t.getAttribute('data-id'))}});
  world.addEventListener('pointerover',function(e){var t=e.target.closest('[data-id]');if(t)light(t.getAttribute('data-id'),true)});
  world.addEventListener('pointerout',function(e){var t=e.target.closest('[data-id]');if(t)light(t.getAttribute('data-id'),false)});
  $('pClose').addEventListener('click',close);
  panel.addEventListener('click',function(e){if(e.target===panel)close()});
  addEventListener('keydown',function(e){if(e.key==='Escape'){if(!box.hidden)closeBox();else close()}});
  var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,120)});

  // from the gate into the realm, and back out with Log out
  // the wallet in the header, its purse and Log out, only while one is connected
  function showAddr(a){
    addr.hidden=!a;$('logout').hidden=!a;
    if(a){addr.querySelector('.l').textContent=a.slice(0,6)+'\u2026'+a.slice(-4);addr.querySelector('.s').textContent=a.slice(0,4)+'\u2026'+a.slice(-2);addr.title=a}
    purse(a);
  }
  // this tab's pass through the gate (sessionStorage, the wallet that entered): back from the joust it walks straight in
  var PASS='horskingdom-pass';
  function pass(v){try{if(v===undefined)return sessionStorage.getItem(PASS);if(v)sessionStorage.setItem(PASS,v);else sessionStorage.removeItem(PASS)}catch(e){return null}}
  // the wallet's purse on Ronin mainnet and its Ronke Score (Santa, 20/10: "how much horske, ronke and ron you have",
  // "also could show the status, like top 69 ronke score"): Ronin's public RPC and the score's API answer this page
  // directly; read when the wallet enters and again every minute while the realm shows
  var RPC='https://api.roninchain.com/rpc',SCORE='https://ronke-score-nine.vercel.app/api/v1/score/';
  var HORSKE='0xc0ca45c2e9448d3876ca86220b2418c719298396',RONKE='0xf988f63bf26c3ed3fbf39922149e3e7b1e5c27cb';
  var short=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1});
  var pv={who:null,seq:0,timer:0};
  function rpc(method,params){return fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:method,params:params})}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error.message);return j.result})}
  function balanceOf(token,a){return rpc('eth_call',[{to:token,data:'0x70a08231'+a.slice(2).toLowerCase().padStart(64,'0')},'latest'])}
  function whole(hex){var w=BigInt(hex||'0x0');return Number(w/1000000000000000n)/1000} // 18 decimals, to 3 places
  function tierOf(rank){return !rank?null:rank<=69?'Top 69':rank<=100?'Top 100':rank<=200?'Top 200':rank<=500?'Top 500':null}
  function purse(a){
    var el=$('pcard');clearInterval(pv.timer);pv.who=a?a.toLowerCase():null;
    if(!a){el.hidden=true;return}
    el.hidden=false;
    var me=++pv.seq,set=function(id,v){if(me===pv.seq)$(id).textContent=v};
    var read=function(){
      if(document.hidden)return;
      Promise.all([balanceOf(HORSKE,a),balanceOf(RONKE,a),rpc('eth_getBalance',[a,'latest'])]).then(function(r){
        set('pH',short.format(whole(r[0])));set('pK',short.format(whole(r[1])));set('pR',short.format(whole(r[2])));
      },function(){if(me===pv.seq&&$('pH').textContent==='\u2026'){set('pH','\u2014');set('pK','\u2014');set('pR','\u2014')}});
      fetch(SCORE+a).then(function(r){return r.status===404?null:r.json()}).then(function(j){
        var d=j&&j.data,rank=d&&d.found!==false?d.rank:null,t=tierOf(rank),s=$('pS');
        if(me!==pv.seq)return;
        s.hidden=!rank;$('pSc').hidden=!rank;if(!rank)return;
        s.textContent=t||('#'+rank.toLocaleString('en'));s.classList.toggle('gold',!!t);
        s.title='Ronke Score: rank '+rank.toLocaleString('en')+(d.score!=null?', '+Number(d.score).toLocaleString('en')+' points':'');
        $('pSc').textContent='Ronke Score: rank '+rank.toLocaleString('en')+(d.score!=null?' \u00b7 '+Number(d.score).toLocaleString('en')+' points':'');
      },function(){});
    };
    ['pH','pK','pR'].forEach(function(id){$(id).textContent='\u2026'});$('pS').hidden=true;$('pSc').hidden=true;
    read();pv.timer=setInterval(read,60000);
  }
  // the card's parts: the address copied (with a word under the card), a well that opens its place
  var toastT=0;
  function say(t){var el=$('pToast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},1800)}
  addr.addEventListener('click',function(){
    var a=window.realmAcct;if(!a)return;
    var done=function(){say('Address copied')},fail=function(){say(a.slice(0,10)+'…'+a.slice(-8))};
    try{navigator.clipboard.writeText(a).then(done,fail)}catch(e){fail()}
  });
  $('pcard').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)open(b.getAttribute('data-go'))});
  // the purse read again at once (the game page's modal says the wallet moved: a swap, a lock)
  window.purseNow=function(){if(window.realmAcct)purse(window.realmAcct)};
  window.enterRealm=function(){
    showAddr(window.realmAcct);pass(window.realmAcct);
    realm.removeAttribute('aria-hidden');realm.style.visibility='visible';
    scene.animate([{opacity:1},{opacity:0}],{duration:reduce.matches?1:260,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}).finished.then(function(){scene.style.display='none'});
  };
  // Log out: the wallet forgotten here (and its permission dropped where the wallet allows it), back to the gate
  function leave(){
    window.realmAcct=null;pass(null);showAddr(null);close();closeBox(true);realm.setAttribute('aria-hidden','true');realm.style.visibility='';
    scene.getAnimations().forEach(function(a){a.cancel()});scene.style.display='';scene.style.visibility='';
    if(window.gateReset)gateReset();
  }
  $('logout').addEventListener('click',function(){
    var p=window.realmProvider&&realmProvider();
    if(p)try{p.request({method:'wallet_revokePermissions',params:[{eth_accounts:{}}]}).catch(function(){})}catch(e){}
    leave();
  });
  var waitP=window.waitProvider||function(){return Promise.resolve(window.realmProvider&&realmProvider())};
  // another account in the wallet shows at once; none sends the player back to the gate (once the wallet is on the page)
  waitP(3000).then(function(wp){if(wp&&wp.on)wp.on('accountsChanged',function(a){if(a&&a[0]){if(window.realmAcct){window.realmAcct=a[0];pass(a[0]);showAddr(a[0])}}else if(window.realmAcct)leave()})});
  build();
  showAddr(null);
  function walkIn(a){window.realmAcct=a;pass(a);scene.style.display='none';showAddr(a);realm.removeAttribute('aria-hidden');realm.style.visibility='visible'}
  // back from the joust (?back=1): this tab passed the gate (its pass), so straight in with that wallet; with no pass (the
  // joust was opened first) the wallet says, once it is on the page (waited for up to 3 s): connected, straight in; not, the gate
  if(new URLSearchParams(location.search).has('back')){
    var held=pass();
    if(held)walkIn(held);
    else{
      scene.style.visibility='hidden';
      setTimeout(function(){if(!window.realmAcct)scene.style.visibility=''},4500);   // a wallet that never answers: the gate
      waitP(3000).then(function(wp){
        if(!wp){scene.style.visibility='';return}
        return wp.request({method:'eth_accounts'}).then(function(a){if(a&&a[0])walkIn(a[0]);else scene.style.visibility=''});
      }).catch(function(){scene.style.visibility=''});
    }
  }
})();
</script>
</body>
